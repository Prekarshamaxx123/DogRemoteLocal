name: Multi-Platform Release Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-linux-and-arch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxfixes-dev zstd

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Linux AppImage, Deb and Arch Packages
        run: |
          ./scripts/build-all.sh all

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lancast-linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.pkg.tar.zst
            dist/*.tar.gz

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: lancast-android-apk
          path: android/app/build/outputs/apk/debug/*.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Windows Executables
        run: |
          pyinstaller --noconfirm --clean --windowed --name "LanCast" --add-data "public;public" main.py
          pyinstaller --noconfirm --clean --windowed --onefile --name "LanCast-Portable" --add-data "public;public" main.py

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: lancast-windows-binaries
          path: |
            dist/LanCast-Portable.exe
            dist/LanCast/

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Build macOS App Bundle & DMG
        run: |
          chmod +x scripts/build-mac.sh
          ./scripts/build-mac.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lancast-macos-package
          path: |
            dist/*.dmg
            dist/*.app
