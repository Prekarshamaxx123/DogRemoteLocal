name: Multi-Platform Release Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-and-arch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxfixes-dev zstd

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Linux AppImage, Deb and Arch Packages
        run: |
          chmod +x scripts/build-all.sh
          ./scripts/build-all.sh all

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dogremote-linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.pkg.tar.zst
            dist/*.tar.gz

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DogRemote-*.AppImage
            dist/dogremote_*.deb
            dist/dogremote-*.pkg.tar.zst
            dist/DogRemote-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/DogRemote-1.0.0.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dogremote-android-apk
          path: dist/DogRemote-1.0.0.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DogRemote-1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Windows Executables
        run: |
          pyinstaller --noconfirm --clean --windowed --name "DogRemote" --add-data "public;public" main.py
          pyinstaller --noconfirm --clean --windowed --onefile --name "DogRemote-Portable" --add-data "public;public" main.py
          Compress-Archive -Path dist/DogRemote -DestinationPath dist/DogRemote-Windows-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dogremote-windows-binaries
          path: |
            dist/DogRemote-Portable.exe
            dist/DogRemote-Windows-x64.zip

      - name: Upload Windows to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DogRemote-Portable.exe
            dist/DogRemote-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Build macOS App Bundle & DMG
        run: |
          chmod +x scripts/build-mac.sh
          ./scripts/build-mac.sh
          cd dist && zip -r DogRemote-macOS.zip DogRemote.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dogremote-macos-package
          path: |
            dist/*.dmg
            dist/DogRemote-macOS.zip

      - name: Upload macOS to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DogRemote-*.dmg
            dist/DogRemote-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
