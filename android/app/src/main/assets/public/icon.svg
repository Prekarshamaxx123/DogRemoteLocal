<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect width="508" height="508" x="2" y="2" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Outer Ring Screen -->
  <rect x="76" y="96" width="360" height="250" rx="36" fill="rgba(255,255,255,0.03)" stroke="url(#primary)" stroke-width="14" filter="url(#glow)"/>
  
  <!-- Stand -->
  <line x1="196" y1="416" x2="316" y2="416" stroke="url(#primary)" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="350" x2="256" y2="416" stroke="url(#primary)" stroke-width="16" stroke-linecap="round"/>

  <!-- Pulse / Beam Wave in center -->
  <circle cx="256" cy="221" r="50" fill="url(#redGlow)" filter="url(#glow)"/>
  <polygon points="244,196 278,221 244,246" fill="#ffffff"/>

  <!-- Wi-Fi / LAN broadcast waves -->
  <path d="M166 160 A130 130 0 0 1 346 160" fill="none" stroke="#00f2fe" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <path d="M196 185 A90 90 0 0 1 316 185" fill="none" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
</svg>
